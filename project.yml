name: Reach
options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
configFiles:
  Debug: Config/Reach.xcconfig
  Release: Config/Reach.xcconfig
packages:
  ReachKit:
    path: Packages/ReachKit
targets:
  ReachHost:
    type: application
    platform: macOS
    sources:
      - path: Apps/ReachHost
        type: syncedFolder
    dependencies:
      - package: ReachKit
        product: ReachCore
      - package: ReachKit
        product: ReachProtocol
    info:
      path: Apps/ReachHost/Info.plist
      properties:
        CFBundleDisplayName: Reach Host
        CFBundleName: Reach Host
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Reach — control your Mac from your iPhone."
        NSAppleEventsUsageDescription: "Reach uses this to open system features like Mission Control on request from your iPhone."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REACH_BUNDLE_ID_PREFIX).host
        PRODUCT_NAME: Reach Host
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
  Reach:
    type: application
    platform: iOS
    sources:
      - path: Apps/ReachiOS
        type: syncedFolder
    dependencies:
      - package: ReachKit
        product: ReachCore
      - package: ReachKit
        product: ReachProtocol
    info:
      path: Apps/ReachiOS/Info.plist
      properties:
        CFBundleDisplayName: Reach
        CFBundleName: Reach
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Reach uses the camera to scan the pairing code shown on your Mac."
        NSLocalNetworkUsageDescription: "Reach connects straight to your Mac when you're on the same network, for the lowest possible latency."
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).pairing
            CFBundleURLSchemes: [reach]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REACH_BUNDLE_ID_PREFIX)
        PRODUCT_NAME: Reach
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
